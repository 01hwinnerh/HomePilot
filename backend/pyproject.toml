[project]
name = "homepilot-api"
version = "0.1.0"
description = "HomePilot 多商家家居平台的 FastAPI 后端"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2.0",
  "asyncmy>=0.2.10,<0.3",
  "celery>=5.4,<6.0",
  "fastapi>=0.115,<1.0",
  "langchain>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-redis>=0.1,<1.0",
  "langsmith>=0.2,<1.0",
  "minio>=7.2,<8.0",
  "pydantic-settings>=2.6,<3.0",
  "qdrant-client>=1.12,<2.0",
  "redis>=5.2,<6.0",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
